; FootHoled H1 — Waveshare ESP32-S3-Touch-LCD-3.5 (NON-B: ST7796 SPI, 320x480)
; Target MCU: ESP32-S3R8 (8 MB PSRAM stacked, 16 MB flash)
;
; Board note: PlatformIO does not ship a dedicated board JSON for the Waveshare
; 3.5 (non-B). esp32-s3-devkitc-1-n16r8v is the closest stock match (same
; flash/PSRAM sizing, same USB-OTG). Verify clock, flash mode and PSRAM
; settings against the schematic before flashing.
; TODO(HW): create a custom waveshare_esp32s3_35.json under boards/ once the
; exact board revision is confirmed on physical hardware.
;
; DISPLAY: ST7796 over STANDARD SPI (NOT QSPI). Touch: FT6336 over I2C.
; LCD/touch reset and (likely) backlight are driven via a TCA9554 I2C expander.
;
; TOOLCHAIN TARGET (authoritative): ESP-IDF 6.1.x and LVGL 9.x. Both are pinned
; in firmware/src/idf_component.yml (idf ">=6.1", lvgl "~9.2.2"). Build with an
; ESP-IDF 6.1 install; do not use 5.x or jump LVGL to 10.

[env:footholed_h1]
platform  = espressif32
board     = esp32-s3-devkitc-1-n16r8v
framework = espidf

board_build.flash_size        = 16MB
board_build.partitions        = partitions.csv
board_upload.flash_size       = 16MB

monitor_speed = 115200

; NOTE: ESP-IDF Kconfig options (CONFIG_*) belong in sdkconfig.defaults, NOT in
; -D build_flags. Only genuine preprocessor defines live here now. (The 3.5B
; version wrongly passed CONFIG_* as -D flags; that is fixed in this repo.)
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE

lib_deps =
    ; LVGL + ST7796 driver pulled via ESP-IDF component manager
    ; (declared in firmware/src/idf_component.yml — no pio lib_deps needed)
