; FootHoled H1 — Waveshare ESP32-S3-Touch-LCD-3.5B (AXS15231B QSPI, 320x480)
; Target MCU: ESP32-S3R8 (8 MB PSRAM stacked, 16 MB flash)
;
; Board note: PlatformIO does not yet ship a dedicated board JSON for the
; Waveshare 3.5B.  esp32-s3-devkitc-1-n16r8v is the closest stock match
; (same flash/PSRAM sizing, same USB-OTG).  Verify clock, flash mode and
; PSRAM settings against the schematic before flashing.
; TODO(HW): create a custom waveshare_esp32s3_35b.json under boards/ once
; the exact board revision (flash: quad/octal, PSRAM: octal) is confirmed
; on physical hardware.

[env:footholed_h1]
platform  = espressif32
board     = esp32-s3-devkitc-1-n16r8v
framework = espidf

; 16 MB flash, 8 MB PSRAM (octal — TODO(HW): confirm octal vs quad on your
; physical board revision)
board_build.flash_size        = 16MB
board_build.partitions        = partitions.csv
board_upload.flash_size       = 16MB

monitor_speed = 115200

build_flags =
    ; LVGL config header discovery
    -D LV_CONF_INCLUDE_SIMPLE
    ; Enable SPIRAM heap so the draw buffer malloc succeeds
    -D CONFIG_SPIRAM=y
    -D CONFIG_SPIRAM_USE_MALLOC=y
    -D CONFIG_SPIRAM_MODE_OCT=y
    ; Larger main task stack for LVGL + BSP init
    -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
    ; AXS15231B driver flag used by the vendor BSP
    -D CONFIG_ESP_LCD_AXS15231B_QSPI=y

lib_deps =
    ; LVGL and AXS15231B driver pulled via ESP-IDF component manager
    ; (declared in firmware/src/idf_component.yml — no pio lib_deps needed)
